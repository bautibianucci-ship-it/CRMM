<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>MercadoVerde — CRM Clientes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{color-scheme:dark;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F1A0F;color:#E8F0E8;padding:24px;-webkit-font-smoothing:antialiased;}
h1{font-size:20px;font-weight:500;margin-bottom:4px;}
.subtitle{font-size:13px;color:#6B8F6B;margin-bottom:24px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.metric{background:#1A2A1A;border-radius:10px;padding:16px;border:0.5px solid #2A3D2A;}
.metric-label{font-size:12px;color:#6B8F6B;margin-bottom:6px;}
.metric-value{font-size:24px;font-weight:500;color:#E8F0E8;line-height:1;}
.metric-sub{font-size:11px;color:#4A6B4A;margin-top:4px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.filter-tabs{display:flex;gap:4px;}
.filter-btn{font-size:12px;padding:6px 14px;border-radius:8px;border:0.5px solid #2A3D2A;background:transparent;cursor:pointer;color:#6B8F6B;transition:all 0.15s;}
.filter-btn.active{background:#1A2A1A;color:#E8F0E8;border-color:#3A5A3A;font-weight:500;}
.btn-add{background:#1A7A3C;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-add:hover{background:#155f30;}
.table-wrap{background:#1A2A1A;border-radius:12px;border:0.5px solid #2A3D2A;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;font-weight:500;color:#6B8F6B;padding:10px 14px;border-bottom:0.5px solid #2A3D2A;text-transform:uppercase;letter-spacing:0.5px;background:#142014;}
td{padding:11px 14px;border-bottom:0.5px solid #1E2E1E;color:#E8F0E8;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#1E2E1E;}
.avatar{width:28px;height:28px;border-radius:50%;background:#1A3A2A;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#52D67A;margin-right:8px;vertical-align:middle;flex-shrink:0;}
.name-cell{display:flex;align-items:center;}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:3px 9px;border-radius:6px;}
.badge-activo{background:#0F2A1A;color:#52D67A;border:0.5px solid #1A5A2A;}
.badge-prueba{background:#0A1A2A;color:#52A8FF;border:0.5px solid #1A3A5A;}
.badge-pendiente{background:#2A1E0A;color:#E8A030;border:0.5px solid #4A3A0A;}
.price-input{width:80px;font-size:13px;padding:5px 8px;border:0.5px solid #2A3D2A;border-radius:6px;text-align:right;background:#142014;color:#E8F0E8;}
.price-input:focus{outline:none;border-color:#1A7A3C;}
.action-btn{background:transparent;border:0.5px solid #2A3D2A;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;color:#6B8F6B;margin-left:3px;transition:all 0.15s;}
.action-btn:hover{background:#1E2E1E;}
.action-btn.danger:hover{background:#2A0F0F;color:#FF6B6B;border-color:#4A1A1A;}
.total-row td{background:#142014;font-weight:500;font-size:13px;border-top:0.5px solid #2A3D2A;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal-box{background:#1A2A1A;border-radius:14px;border:0.5px solid #2A3D2A;padding:24px;width:380px;max-width:95vw;}
.modal-title{font-size:16px;font-weight:500;margin-bottom:18px;color:#E8F0E8;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:#6B8F6B;margin-bottom:5px;}
.field input,.field select{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid #2A3D2A;border-radius:8px;background:#0F1A0F;color:#E8F0E8;}
.field input:focus,.field select:focus{outline:none;border-color:#52D67A;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.btn-cancel{background:transparent;border:0.5px solid #2A3D2A;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;color:#6B8F6B;}
.btn-save{background:#1A7A3C;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:500;cursor:pointer;}
.btn-save:hover{background:#155f30;}
.empty{text-align:center;padding:40px;color:#4A6B4A;font-size:13px;}
@media(max-width:700px){
  .metrics{grid-template-columns:repeat(2,1fr);}
  .toolbar{flex-direction:column;align-items:flex-start;}
  body{padding:16px;}
  th:nth-child(5),td:nth-child(5){display:none;}
}
</style>
</head>

        <td id="total-cell" style="font-size:15px;color:#1A7A3C;">USD $0</td>
        <td colspan="2"></td>
      </tr>
    </tfoot>
  </table>
</div>

<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Nuevo cliente</div>
    <div class="field"><label>Nombre del puesto *</label><input type="text" id="f-nombre" placeholder="Ej: Verdulería La Esquina"/></div>
    <div class="field"><label>Ciudad</label><input type="text" id="f-ciudad" placeholder="Ej: Mar del Plata"/></div>
    <div class="field"><label>Teléfono WhatsApp</label><input type="text" id="f-tel" placeholder="Ej: 2234 123456"/></div>
    <div class="field">
      <label>Estado</label>
      <select id="f-estado">
        <option value="activo">Activo</option>
        <option value="prueba">En prueba</option>
        <option value="pendiente">Pendiente</option>
      </select>
    </div>
    <div class="field"><label>Precio mensual (ARS)</label><input type="number" id="f-precio" value="120000" min="0" step="1"/></div>
    <div class="field"><label>Cliente desde</label><input type="month" id="f-desde"/></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveClient()">Guardar</button>
    </div>
  </div>
</div>

<script>
let clients = JSON.parse(localStorage.getItem('mv-clients') || '[]');
let nextId = parseInt(localStorage.getItem('mv-nextid') || '1');
let editingId = null;
let currentFilter = 'todos';

if(clients.length === 0) {
  clients = [
    {id:1,nombre:'Puesto Don Roberto',ciudad:'Mar del Plata',tel:'2234 561234',estado:'activo',precio:120000,desde:'Ene 2024'},
    {id:2,nombre:'Verdulería El Verde',ciudad:'Mar del Plata',tel:'2234 445566',estado:'activo',precio:120000,desde:'Mar 2024'},
    {id:3,nombre:'Frutería Los Andes',ciudad:'Mar del Plata',tel:'2234 778899',estado:'activo',precio:85000,desde:'Jun 2023'},
    {id:4,nombre:'Puesto La Familia',ciudad:'Mar del Plata',tel:'2234 332211',estado:'prueba',precio:0,desde:'Jun 2025'},
    {id:5,nombre:'Verdulería Central',ciudad:'Balcarce',tel:'2266 112233',estado:'prueba',precio:0,desde:'Jun 2025'},
    {id:6,nombre:'Frutas y Verduras Pérez',ciudad:'Mar del Plata',tel:'2234 998877',estado:'pendiente',precio:85000,desde:'Ago 2023'},
  ];
  nextId = 7;
  save();
}

function save() {
  localStorage.setItem('mv-clients', JSON.stringify(clients));
  localStorage.setItem('mv-nextid', String(nextId));
}

function initials(name) {
  return name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
}

function badgeHtml(estado) {
  const map = {activo:['badge-activo','Activo'],prueba:['badge-prueba','En prueba'],pendiente:['badge-pendiente','Pendiente']};
  const [cls,label] = map[estado]||['badge-pendiente',estado];
  return `<span class="badge ${cls}">${label}</span>`;
}

function render() {
  const filtered = currentFilter==='todos' ? clients : clients.filter(c=>c.estado===currentFilter);
  const tbody = document.getElementById('tbody');

  if(filtered.length===0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">No hay clientes en esta categoría</td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(c=>`
      <tr>
        <td><div class="name-cell"><div class="avatar">${initials(c.nombre)}</div>${c.nombre}</div></td>
        <td>${c.ciudad}</td>
        <td>${badgeHtml(c.estado)}</td>
        <td>
          <input class="price-input" type="number" value="${c.precio}" min="0" step="1"
            onchange="updatePrice(${c.id},this.value)"/>
          <span style="font-size:11px;color:#aaa;margin-left:3px;">ARS</span>
        </td>
        <td style="color:#aaa;font-size:12px;">${c.desde}</td>
        <td>
          <button class="action-btn" onclick="editClient(${c.id})" title="Editar"><i class="ti ti-edit"></i></button>
          <button class="action-btn danger" onclick="deleteClient(${c.id})" title="Eliminar"><i class="ti ti-trash"></i></button>
        </td>
      </tr>
    `).join('');
  }

  const total = filtered.reduce((s,c)=>s+(Number(c.precio)||0),0);
  document.getElementById('total-cell').textContent = '$ ' + total.toLocaleString('es-AR');
  updateMetrics();
}

function updateMetrics() {
  const activos = clients.filter(c=>c.estado==='activo').length;
  const prueba = clients.filter(c=>c.estado==='prueba').length;
  const pendientes = clients.filter(c=>c.estado==='pendiente').length;
  const mrr = clients.filter(c=>c.estado==='activo').reduce((s,c)=>s+(Number(c.precio)||0),0);
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Total clientes</div><div class="metric-value">${clients.length}</div><div class="metric-sub">${activos} activos · ${prueba} en prueba</div></div>
    <div class="metric"><div class="metric-label">MRR mensual</div><div class="metric-value">$ ${mrr.toLocaleString('es-AR')}</div><div class="metric-sub">Ingresos recurrentes activos</div></div>
    <div class="metric"><div class="metric-label">En prueba</div><div class="metric-value">${prueba}</div><div class="metric-sub">15 días gratis</div></div>
    <div class="metric"><div class="metric-label">Pendientes</div><div class="metric-value">${pendientes}</div><div class="metric-sub">Por confirmar</div></div>
  `;
}

function updatePrice(id, val) {
  const c = clients.find(c=>c.id===id);
  if(c) { c.precio = Number(val)||0; save(); updateMetrics(); recalcTotal(); }
}

function recalcTotal() {
  const filtered = currentFilter==='todos' ? clients : clients.filter(c=>c.estado===currentFilter);
  const total = filtered.reduce((s,c)=>s+(Number(c.precio)||0),0);
  document.getElementById('total-cell').textContent = '$ ' + total.toLocaleString('es-AR');
}

function filterClients(estado, el) {
  currentFilter = estado;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nuevo cliente';
  document.getElementById('f-nombre').value = '';
  document.getElementById('f-ciudad').value = 'Mar del Plata';
  document.getElementById('f-tel').value = '';
  document.getElementById('f-estado').value = 'activo';
  document.getElementById('f-precio').value = '99';
  document.getElementById('f-desde').value = new Date().toISOString().slice(0,7);
  document.getElementById('modal').style.display = 'flex';
}

function editClient(id) {
  const c = clients.find(c=>c.id===id);
  if(!c) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Editar cliente';
  document.getElementById('f-nombre').value = c.nombre;
  document.getElementById('f-ciudad').value = c.ciudad;
  document.getElementById('f-tel').value = c.tel;
  document.getElementById('f-estado').value = c.estado;
  document.getElementById('f-precio').value = c.precio;
  document.getElementById('f-desde').value = c.desdeRaw || new Date().toISOString().slice(0,7);
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function saveClient() {
  const nombre = document.getElementById('f-nombre').value.trim();
  if(!nombre) { alert('El nombre es obligatorio'); return; }
  const data = {
    nombre,
    ciudad: document.getElementById('f-ciudad').value.trim() || 'Mar del Plata',
    tel: document.getElementById('f-tel').value.trim(),
    estado: document.getElementById('f-estado').value,
    precio: Number(document.getElementById('f-precio').value)||0,
    desdeRaw: document.getElementById('f-desde').value,
    desde: new Date(document.getElementById('f-desde').value + '-01').toLocaleDateString('es-AR',{month:'short',year:'numeric'})
  };
  if(editingId) {
    const idx = clients.findIndex(c=>c.id===editingId);
    if(idx>=0) clients[idx] = {...clients[idx], ...data};
  } else {
    clients.push({id: nextId++, ...data});
  }
  save();
  closeModal();
  render();
}

function deleteClient(id) {
  if(!confirm('¿Eliminar este cliente?')) return;
  clients = clients.filter(c=>c.id!==id);
  save();
  render();
}

document.getElementById('modal').addEventListener('click', function(e) {
  if(e.target===this) closeModal();
});

render();
</script>
</body>
</html>
